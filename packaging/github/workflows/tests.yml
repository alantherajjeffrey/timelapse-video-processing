name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source/requirements.lock.txt
          python -m pip install --no-deps -e source
      - name: Privacy scan
        run: python tools/scrub_check.py --git
      - name: Tests (synthetic data, no screen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --basetemp "${{ runner.temp }}\pytest"
